<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baca Al-Qur'an 30 Juz - Nurul Huda</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        .quran-header-filter {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .quran-search-input {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border-glass);
            padding: 12px 18px;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(12px);
        }
        .quran-search-input:focus {
            border-color: var(--primary-gold);
        }
        .surah-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }
        .surah-card {
            background: var(--surface);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(12px);
        }
        .surah-card:hover {
            transform: translateY(-3px);
            background: var(--surface-hover);
            border-color: rgba(212, 175, 55, 0.4);
        }
        .surah-info h3 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 4px;
        }
        .surah-info p {
            font-size: 12px;
            color: var(--text-muted);
        }
        .surah-arabic {
            font-size: 22px;
            color: var(--primary-gold);
            font-family: 'Traditional Arabic', serif;
            text-align: right;
        }
        .surah-number {
            width: 38px;
            height: 38px;
            background: rgba(212, 175, 55, 0.1);
            color: var(--primary-gold);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            flex-shrink: 0;
            margin-right: 14px;
        }
        .surah-left {
            display: flex;
            align-items: center;
        }
        .loading-box {
            text-align: center;
            color: var(--primary-gold);
            padding: 50px;
            font-size: 16px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class='bx bx-book-heart'></i> NURUL HUDA</div>
        <nav class="nav-links">
            <a href="index.html">Beranda</a>
            <a href="kisah.html">Kisah & Sejarah</a>
            <a href="tentang.html">Tentang</a>
        </nav>
        <a href="quran.html" class="btn-quran-header active">
            <i class='bx bx-book-open'></i> Baca Al-Qur'an (30 Juz)
        </a>
    </header>

    <div class="container">
        <div class="hero-card">
            <h1>Al-Qur'an Al-Karim (30 Juz)</h1>
            <p>Daftar lengkap 114 Surah Al-Qur'an dari data resmi Kemenag. Klik salah satu surah untuk membaca teks ayat lengkap dan terjemahannya.</p>
        </div>

        <div class="quran-header-filter">
            <input type="text" id="searchInput" class="quran-search-input" placeholder="Cari nama surah (contoh: Al-Fatihah, Yasin, Al-Mulk, An-Nas)..." onkeyup="filterSurah()">
        </div>
        
        <div class="surah-grid" id="surahContainer">
            <div class="loading-box"><i class='bx bx-loader-alt bx-spin'></i> Memuat 114 Surah Al-Qur'an...</div>
        </div>
    </div>

    <footer>
        WEBSITE CREATED BY <strong>LIONEL ALVIO</strong> &copy; 2026
    </footer>

    <!-- Modal Detail Surah -->
    <div id="surahModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(5,10,7,0.95); z-index:2000; overflow-y:auto; padding:20px;">
        <div style="max-width:850px; margin:40px auto; background:var(--surface); border:1px solid var(--border-glass); border-radius:20px; padding:30px; backdrop-filter:blur(20px); position:relative;">
            <button onclick="closeModal()" style="position:absolute; top:20px; right:20px; background:rgba(239,68,68,0.15); color:#ef4444; border:1px solid rgba(239,68,68,0.3); padding:8px 14px; border-radius:10px; cursor:pointer; font-weight:600;"><i class='bx bx-x'></i> Tutup</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        let allSurahs = [];

        async function fetchSurahList() {
            try {
                const response = await fetch('https://equran.id/api/v2/surat');
                const json = await response.json();
                allSurahs = json.data;
                renderSurahList(allSurahs);
            } catch (error) {
                document.getElementById('surahContainer').innerHTML = `
                    <div class="loading-box" style="color:#ef4444;">
                        <i class='bx bx-error-circle'></i> Gagal memuat data. Pastikan pakai <b>Live Server VS Code</b> dan terhubung ke internet!
                    </div>`;
            }
        }

        function renderSurahList(data) {
            const container = document.getElementById('surahContainer');
            container.innerHTML = '';
            data.forEach(surah => {
                const card = document.createElement('div');
                card.className = 'surah-card';
                card.onclick = () => loadDetailSurah(surah.nomor);
                card.innerHTML = `
                    <div class="surah-left">
                        <div class="surah-number">${surah.nomor}</div>
                        <div class="surah-info">
                            <h3>${surah.namaLatin}</h3>
                            <p>${surah.arti} • ${surah.jumlahAyat} Ayat</p>
                        </div>
                    </div>
                    <div class="surah-arabic">${surah.nama}</div>
                `;
                container.appendChild(card);
            });
        }

        function filterSurah() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allSurahs.filter(s => 
                s.namaLatin.toLowerCase().includes(query) || 
                s.arti.toLowerCase().includes(query) ||
                s.nama.includes(query)
            );
            renderSurahList(filtered);
        }

        async function loadDetailSurah(nomor) {
            const modal = document.getElementById('surahModal');
            const content = document.getElementById('modalContent');
            modal.style.display = 'block';
            content.innerHTML = '<div class="loading-box"><i class=\'bx bx-loader-alt bx-spin\'></i> Memuat seluruh ayat dan terjemahan...</div>';

            try {
                const res = await fetch(`https://equran.id/api/v2/surat/${nomor}`);
                const json = await res.json();
                const data = json.data;

                let html = `
                    <div style="text-align:center; margin-bottom:24px; border-bottom:1px solid var(--border-glass); padding-bottom:16px;">
                        <h2 style="color:var(--primary-gold); font-size:26px; margin-bottom:4px;">${data.namaLatin} (${data.nama})</h2>
                        <p style="color:var(--text-muted); font-size:14px;">Arti: ${data.arti} | Tempat Turun: ${data.tempatTurun} | Jumlah Ayat: ${data.jumlahAyat}</p>
                        <p style="margin-top:10px; font-size:13px; color:var(--text-muted); line-height:1.5;">${data.deskripsi}</p>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:20px;">
                `;

                data.ayat.forEach(ayat => {
                    html += `
                        <div style="background:rgba(9,19,14,0.6); border:1px solid var(--border-glass); padding:20px; border-radius:14px;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                                <span style="background:rgba(212,175,55,0.1); color:var(--primary-gold); padding:4px 10px; border-radius:8px; font-size:12px; font-weight:600;">Ayat ${ayat.nomorAyat}</span>
                            </div>
                            <div style="font-size:28px; color:#fff; text-align:right; margin-bottom:16px; font-family:'Traditional Arabic', serif; line-height:2.4;">${ayat.teksArab}</div>
                            <div style="font-size:14px; color:var(--primary-gold); margin-bottom:10px; font-style:italic; line-height:1.6;">${ayat.teksLatin}</div>
                            <div style="font-size:13px; color:var(--text-muted); line-height:1.7;">${ayat.teksIndonesia}</div>
                        </div>
                    `;
                });

                html += `</div>`;
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = '<p style="color:#ef4444; text-align:center; padding:30px;">Gagal memuat detail ayat. Periksa koneksi internet.</p>';
            }
        }

        function closeModal() {
            document.getElementById('surahModal').style.display = 'none';
        }

        // Ambil data pas halaman dibuka
        fetchSurahList();
    </script>
</body>
</html>
